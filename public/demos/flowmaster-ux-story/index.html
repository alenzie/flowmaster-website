<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Flowmaster workflow walkthrough</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body { margin:0; background:#07080b }
a { color:#ff6b6b; text-decoration:none }
a:hover { color:#ff9b9b }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
@keyframes fmspin { to { transform: rotate(360deg) } }
@keyframes fmfadeup { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform: translateY(0) } }
</style>
<script>window.OM_SCENES = '[{"name":"Setup","dur":5,"desc":"Title card on black before the desktop appears"},{"name":"OpenOBS","dur":4.8,"desc":"On the desktop the OBS Studio icon is double-clicked and OBS opens","nat":6},{"name":"OpenFM","dur":5,"desc":"Flowmaster is launched from the taskbar and connects to OBS on top of it"},{"name":"Record","dur":5.3,"desc":"Start Recording is clicked in OBS and the timer starts","nat":4.3},{"name":"Idle","dur":5,"desc":"The game is recording fullscreen; Flowmaster sits in the tray with OBS connected"},{"name":"Mark","dur":7,"desc":"F9 is pressed three times mid-game; each press flashes the keycap and saves a mark"},{"name":"Session","dur":6,"desc":"Recording ends, the game window falls away and the finished session slides into the Mark tab"},{"name":"Windows","dur":9.1,"desc":"On the Clip tab the lookback and lookforward values rise and the window diagram redraws","nat":8},{"name":"Player","dur":15,"desc":"The video player opens to recap the recording, jumps to the second mark, zooms in and deletes it"},{"name":"Output","dur":5,"desc":"On the Clip tab the Reel output pill is clicked so both reel and clips are produced","nat":5},{"name":"Extract","dur":6,"desc":"Extraction runs through probing, merging, stream copy and reel writing"},{"name":"Settings","dur":8,"desc":"The settings panel slides in; the theme changes twice and the mark key becomes F8"},{"name":"Clean","dur":9,"desc":"The Clean tab scans, lists four categories of removable originals, then moves them to the Recycle Bin"},{"name":"Assembler","dur":7,"desc":"Back on the Mark tab, the Project Assembler callout explains the export and the button is pressed"},{"name":"Editor","dur":11,"desc":"Prime Pro opens with the clip loaded, the marks as timeline markers, and playback begins before the fade to black"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"times","count":1}';</script>
</helmet>
<x-import component-from-global-scope="FlowmasterStory" from="./animations-v3.jsx?v=mobile-2 ./obs-studio.jsx ./editor-ui.jsx ./flowmaster-story.jsx?v=mobile-2" footage="{{ footage }}" hint-size="100%,100%"></x-import>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;footage&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;video&quot;,&quot;options&quot;:[&quot;webgl&quot;,&quot;video&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Gameplay footage&quot;}}"></script>
</body>
</html>
